name: Build Go projects and release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "GoMonitoringPanel/v*"
      - "GpsSyncTime/v*"
      - "HomeController/v*"
      - "RelayClient/v*"
      - "WebShare/v*"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      project:
        description: Project to build
        required: true
        default: all
        type: choice
        options:
          - all
          - GoMonitoringPanel
          - GpsSyncTime
          - HomeController
          - RelayClient
          - WebShare

permissions:
  contents: read

jobs:
  prepare:
    name: Select projects
    runs-on: ubuntu-24.04

    outputs:
      projects: ${{ steps.select.outputs.projects }}
      version: ${{ steps.select.outputs.version }}

    steps:
      - name: Select projects and release version
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SELECTED_PROJECT: ${{ inputs.project }}
        run: |
          python3 <<'PY'
          import json
          import os

          projects = [
              "GoMonitoringPanel",
              "GpsSyncTime",
              "HomeController",
              "RelayClient",
              "WebShare",
          ]

          selected = projects
          version = ""

          is_release = (
              os.environ["EVENT_NAME"] == "push"
              and os.environ["REF_TYPE"] == "tag"
          )

          if is_release:
              tag = os.environ["REF_NAME"]

              if tag.startswith("v"):
                  version = tag
              else:
                  project, version = tag.split("/", 1)

                  if project not in projects:
                      raise SystemExit(f"Unknown project: {project}")

                  if not version.startswith("v"):
                      raise SystemExit(f"Invalid release tag: {tag}")

                  selected = [project]
          else:
              project = os.environ.get("SELECTED_PROJECT") or "all"

              if project != "all":
                  if project not in projects:
                      raise SystemExit(f"Unknown project: {project}")

                  selected = [project]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"projects={json.dumps(selected)}\n")
              output.write(f"version={version}\n")

          print(f"Selected projects: {', '.join(selected)}")
          print(f"Release version: {version or 'build only'}")
          PY

  build:
    name: Build ${{ matrix.project }}
    needs: prepare
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.prepare.outputs.projects) }}

    env:
      PROJECT: ${{ matrix.project }}
      CGO_ENABLED: "0"
      GOWORK: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Prepare Go module
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail

          if [ ! -f go.mod ]; then
            go mod init "ci.local/$PROJECT"
          fi

          go mod tidy
          go mod download

      - name: Build and package platforms
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail

          output_dir="$GITHUB_WORKSPACE/artifacts/$PROJECT"
          mkdir -p "$output_dir"

          platforms=(
            "linux/amd64"
            "linux/arm"
            "linux/arm64"
            "linux/riscv64"
          )

          if [ "$PROJECT" != "GoMonitoringPanel" ]; then
            platforms+=("windows/amd64")
          fi

          for platform in "${platforms[@]}"; do
            IFS=/ read -r target_os target_arch <<< "$platform"

            export GOOS="$target_os"
            export GOARCH="$target_arch"

            if [ "$target_arch" = "arm" ]; then
              export GOARM=7
            else
              unset GOARM
            fi

            platform_name="$target_os-$target_arch"
            package_root="$RUNNER_TEMP/packages/$PROJECT/$platform_name"
            package_dir="$package_root/$PROJECT"

            mkdir -p "$package_dir"

            executable="$PROJECT"

            if [ "$target_os" = "windows" ]; then
              executable="$PROJECT.exe"
            fi

            echo "::group::Build $PROJECT for $platform"

            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "$package_dir/$executable" \
              .

            test -s "$package_dir/$executable"

            if [ "$target_os" = "linux" ]; then
              chmod 755 "$package_dir/$executable"
            fi

            for file in config.yml config.yaml README.md; do
              if [ -f "$file" ]; then
                cp "$file" "$package_dir/"
              fi
            done

            if [ -d web ]; then
              cp -a web "$package_dir/"
            fi

            archive_base="$output_dir/$PROJECT-$platform_name"

            if [ "$target_os" = "windows" ]; then
              (
                cd "$package_root"
                zip -qr "$archive_base.zip" "$PROJECT"
              )
            else
              tar -czf "$archive_base.tar.gz" \
                -C "$package_root" \
                "$PROJECT"
            fi

            echo "::endgroup::"
          done

          cd "$output_dir"

          shopt -s nullglob
          archives=(./*.tar.gz ./*.zip)

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: No archives were created"
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS

      - name: Upload project artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-binaries
          path: artifacts/${{ matrix.project }}/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Release ${{ matrix.project }}
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.prepare.outputs.projects) }}

    steps:
      - name: Download project artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}-binaries
          path: release-assets

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          release_tag="$PROJECT/$VERSION"

          if ! gh release view "$release_tag" > /dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$SOURCE_SHA" \
              --title "$PROJECT $VERSION" \
              --generate-notes
          fi

          shopt -s nullglob

          archives=(
            release-assets/*.tar.gz
            release-assets/*.zip
          )

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: No release archives were downloaded"
            exit 1
          fi

          gh release upload "$release_tag" \
            "${archives[@]}" \
            release-assets/SHA256SUMS \
            --clobber
