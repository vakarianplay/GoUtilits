name: Build GoMeshtasticBot and release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: GoMeshtasticBot
  CGO_ENABLED: "1"
  GOWORK: "off"

jobs:
  build:
    name: Build all platforms
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install compilers and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            gcc-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu \
            gcc-mingw-w64-x86-64 \
            zip

      - name: Prepare Go module
        run: |
          set -euo pipefail

          if [ ! -f go.mod ]; then
            go mod init github.com/vakarianplay/GoMeshtasticBot
          fi

          go mod tidy
          go mod download
          go mod verify

      - name: Check required package files
        run: |
          set -euo pipefail

          for file in README.md config.yml; do
            if [ ! -s "$file" ]; then
              echo "::error::Required file is missing or empty: $file"
              exit 1
            fi
          done

      - name: Build and package all platforms
        run: |
          set -euo pipefail

          output_dir="$GITHUB_WORKSPACE/dist"
          mkdir -p "$output_dir"

          # Format: GOOS/GOARCH/C compiler
          platforms=(
            "linux/amd64/gcc"
            "linux/arm/arm-linux-gnueabihf-gcc"
            "linux/arm64/aarch64-linux-gnu-gcc"
            "linux/riscv64/riscv64-linux-gnu-gcc"
            "windows/amd64/x86_64-w64-mingw32-gcc"
          )

          for platform in "${platforms[@]}"; do
            IFS=/ read -r target_os target_arch compiler <<< "$platform"

            platform_name="$target_os-$target_arch"
            executable="$APP_NAME"
            goarm=""

            if [ "$target_arch" = "arm" ]; then
              goarm="7"
              platform_name="linux-armv7"
            fi

            if [ "$target_os" = "windows" ]; then
              executable="${APP_NAME}.exe"
              platform_name="windows-x64"
            fi

            package_dir="$RUNNER_TEMP/packages/$APP_NAME/$platform_name"
            mkdir -p "$package_dir"

            echo "::group::Build $APP_NAME for $platform_name"

            GOOS="$target_os" \
            GOARCH="$target_arch" \
            GOARM="$goarm" \
            CC="$compiler" \
            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "$package_dir/$executable" \
              .

            test -s "$package_dir/$executable"

            cp README.md config.yml "$package_dir/"

            archive_base="$output_dir/$APP_NAME-$platform_name"

            if [ "$target_os" = "windows" ]; then
              (
                cd "$package_dir"
                zip -9 "$archive_base.zip" \
                  "$executable" \
                  README.md \
                  config.yml
              )
            else
              chmod 755 "$package_dir/$executable"

              tar -czf "$archive_base.tar.gz" \
                -C "$package_dir" \
                "$executable" \
                README.md \
                config.yml
            fi

            echo "::endgroup::"
          done

          cd "$output_dir"

          shopt -s nullglob
          archives=(*.tar.gz *.zip)

          if [ "${#archives[@]}" -ne 5 ]; then
            echo "::error::Expected 5 platform archives"
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoMeshtasticBot-binaries
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: GoMeshtasticBot-binaries
          path: release-assets

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          archives=(
            release-assets/*.tar.gz
            release-assets/*.zip
          )

          if [ "${#archives[@]}" -ne 5 ]; then
            echo "::error::Expected 5 release archives"
            exit 1
          fi

          (
            cd release-assets
            sha256sum --check SHA256SUMS.txt
          )

          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$APP_NAME $RELEASE_TAG" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" \
            "${archives[@]}" \
            release-assets/SHA256SUMS.txt \
            --clobber
